# ==============================================================================
# INTEGRITYAI - PROMETHEUS & GRAFANA MONITORING STACK
# ==============================================================================
# Run alongside local services with:
#   docker compose -f docker-compose.monitoring.yml up -d
#
# Access URLs:
#   - Prometheus Targets & Queries: http://localhost:9090
#   - Grafana Live Dashboard:        http://localhost:3000
# ==============================================================================

services:
  # ==========================================
  # 1. PROMETHEUS METRICS ENGINE (Port 9090)
  # ==========================================
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: integrityai-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - integrityai-monitoring-network

  # ==========================================
  # 2. GRAFANA OBSERVABILITY DASHBOARD (Port 3000)
  # ==========================================
  grafana:
    image: grafana/grafana:11.2.0
    container_name: integrityai-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - integrityai-monitoring-network

networks:
  integrityai-monitoring-network:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
