services:
  # ==========================================
  # 1. POSTGRESQL DATABASE
  # ==========================================
  postgres:
    image: postgres:17-alpine
    container_name: integrityai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-root}
      POSTGRES_DB: integrityai_auth
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - integrityai-network

  # ==========================================
  # 1.5. EUREKA DISCOVERY SERVER (Port 8761)
  # ==========================================
  eureka-server:
    build:
      context: ./MSA-ML/eureka-server
      dockerfile: Dockerfile
    image: aarmee/integrityai-eureka-server:latest
    container_name: integrityai-eureka-server
    restart: unless-stopped
    ports:
      - "8761:8761"
    environment:
      SERVER_PORT: 8761
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "false"
      EUREKA_CLIENT_FETCH_REGISTRY: "false"
    networks:
      - integrityai-network

  # ==========================================
  # 2. AUTH SERVICE (Port 8081)
  # ==========================================
  auth-service:
    build:
      context: ./MSA-ML/auth-service
      dockerfile: Dockerfile
    image: aarmee/integrityai-auth-service:latest
    container_name: integrityai-auth-service
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/integrityai_auth
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      JWT_SECRET: ${JWT_SECRET:-integrityai-secret-key-for-jwt-authentication-2026-must-be-at-least-256-bits}
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
      EUREKA_URI: http://eureka-server:8761/eureka/
      EUREKA_REGISTER: ${EUREKA_REGISTER:-true}
      EUREKA_FETCH: ${EUREKA_FETCH:-true}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks:
      - integrityai-network

  # ==========================================
  # 3. FACULTY SERVICE (Port 8082)
  # ==========================================
  faculty-service:
    build:
      context: ./MSA-ML/faculty-service
      dockerfile: Dockerfile
    image: aarmee/integrityai-faculty-service:latest
    container_name: integrityai-faculty-service
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/integrityai_faculty
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      JWT_SECRET: ${JWT_SECRET:-integrityai-secret-key-for-jwt-authentication-2026-must-be-at-least-256-bits}
      EUREKA_URI: http://eureka-server:8761/eureka/
      EUREKA_REGISTER: ${EUREKA_REGISTER:-true}
      EUREKA_FETCH: ${EUREKA_FETCH:-true}
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks:
      - integrityai-network

  # ==========================================
  # 4. SUBMISSION SERVICE (Port 8083)
  # ==========================================
  submission-service:
    build:
      context: ./MSA-ML/submission-service
      dockerfile: Dockerfile
    image: aarmee/integrityai-submission-service:latest
    container_name: integrityai-submission-service
    restart: unless-stopped
    environment:
      MONGODB_URI: ${MONGODB_URI}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-integrityai_submission}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-eu-north-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-integrityai-submissions-aarmee}
      AI_ANALYSIS_SERVICE_URL: http://ai-analysis-service:8090
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
      AUTH_SERVICE_URL: http://auth-service:8081
      FACULTY_SERVICE_URL: http://faculty-service:8082
      JWT_SECRET: ${JWT_SECRET:-integrityai-secret-key-for-jwt-authentication-2026-must-be-at-least-256-bits}
      EUREKA_URI: http://eureka-server:8761/eureka/
      EUREKA_REGISTER: ${EUREKA_REGISTER:-true}
      EUREKA_FETCH: ${EUREKA_FETCH:-true}
    ports:
      - "8083:8083"
    volumes:
      - uploads_data:/tmp/integrityai_uploads
    depends_on:
      eureka-server:
        condition: service_started
    networks:
      - integrityai-network

  # ==========================================
  # 5. NOTIFICATION SERVICE (Port 8084)
  # ==========================================
  notification-service:
    build:
      context: ./MSA-ML/notification-service
      dockerfile: Dockerfile
    image: aarmee/integrityai-notification-service:latest
    container_name: integrityai-notification-service
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/integrityai_notification
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM: ${RESEND_FROM:-IntegrityAI Academic Portal <onboarding@resend.dev>}
      RESEND_TEST_EMAIL: ${RESEND_TEST_EMAIL:-aaru140604@gmail.com}
      AUTH_SERVICE_URL: http://auth-service:8081
      JWT_SECRET: ${JWT_SECRET:-integrityai-secret-key-for-jwt-authentication-2026-must-be-at-least-256-bits}
      EUREKA_URI: http://eureka-server:8761/eureka/
      EUREKA_REGISTER: ${EUREKA_REGISTER:-true}
      EUREKA_FETCH: ${EUREKA_FETCH:-true}
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks:
      - integrityai-network

  # ==========================================
  # 6. REPORT SERVICE (Port 8085)
  # ==========================================
  report-service:
    build:
      context: ./MSA-ML/report-service
      dockerfile: Dockerfile
    image: aarmee/integrityai-report-service:latest
    container_name: integrityai-report-service
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/integrityai_report
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      JWT_SECRET: ${JWT_SECRET:-integrityai-secret-key-for-jwt-authentication-2026-must-be-at-least-256-bits}
      AI_ANALYSIS_SERVICE_URL: http://ai-analysis-service:8090
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
      EUREKA_URI: http://eureka-server:8761/eureka/
      EUREKA_REGISTER: ${EUREKA_REGISTER:-true}
      EUREKA_FETCH: ${EUREKA_FETCH:-true}
    ports:
      - "8085:8085"
    volumes:
      - uploads_data:/tmp/integrityai_uploads
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks:
      - integrityai-network

  # ==========================================
  # 7. AI ANALYSIS SERVICE (Port 8090 - Python FastAPI)
  # ==========================================
  ai-analysis-service:
    build:
      context: ./MSA-ML/ai-analysis-service
      dockerfile: Dockerfile
    image: aarmee/integrityai-analysis-service:latest
    container_name: integrityai-analysis-service
    restart: unless-stopped
    environment:
      MONGODB_URI: ${MONGODB_URI}
      PORT: 8090
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-eu-north-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-integrityai-submissions-aarmee}
    ports:
      - "8090:8090"
    volumes:
      - uploads_data:/tmp/integrityai_uploads
    networks:
      - integrityai-network

  # ==========================================
  # 8. API GATEWAY (Port 8080)
  # ==========================================
  api-gateway:
    build:
      context: ./MSA-ML/api-gateway
      dockerfile: Dockerfile
    image: aarmee/integrityai-gateway:latest
    container_name: integrityai-gateway
    restart: unless-stopped
    environment:
      AUTH_SERVICE_URI: http://auth-service:8081
      FACULTY_SERVICE_URI: http://faculty-service:8082
      SUBMISSION_SERVICE_URI: http://submission-service:8083
      NOTIFICATION_SERVICE_URI: http://notification-service:8084
      REPORT_SERVICE_URI: http://report-service:8085
      AI_ANALYSIS_SERVICE_URI: http://ai-analysis-service:8090
      JWT_SECRET: ${JWT_SECRET:-integrityai-secret-key-for-jwt-authentication-2026-must-be-at-least-256-bits}
      EUREKA_URI: http://eureka-server:8761/eureka/
      EUREKA_REGISTER: ${EUREKA_REGISTER:-true}
      EUREKA_FETCH: ${EUREKA_FETCH:-true}
    ports:
      - "8080:8080"
    depends_on:
      - eureka-server
      - auth-service
      - faculty-service
      - submission-service
      - notification-service
      - report-service
      - ai-analysis-service
    networks:
      - integrityai-network

  # ==========================================
  # 9. FRONTEND CLIENT (Port 5173 / 80)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_GATEWAY_URL: ${VITE_API_GATEWAY_URL:-http://localhost:8080}
    image: aarmee/integrityai-frontend:latest
    container_name: integrityai-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api-gateway
    networks:
      - integrityai-network

  # ==========================================
  # 10. PROMETHEUS METRICS ENGINE (Port 9090)
  # ==========================================
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: integrityai-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - integrityai-network

  # ==========================================
  # 11. GRAFANA OBSERVABILITY DASHBOARD (Port 3000)
  # ==========================================
  grafana:
    image: grafana/grafana:11.2.0
    container_name: integrityai-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - integrityai-network

networks:
  integrityai-network:
    driver: bridge

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  uploads_data:
