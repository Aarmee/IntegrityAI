# ==============================================================================
# INTEGRITYAI - PROMETHEUS CONFIGURATION
# ==============================================================================
# Scrapes Spring Boot Actuator Micrometer & Python FastAPI /metrics
# Supports both:
# 1. Native Windows Host (host.docker.internal:8080..8090 via start-all-services)
# 2. Docker Compose network (api-gateway:8080, etc.)
# ==============================================================================

global:
  scrape_interval: 5s
  evaluation_interval: 5s
  scrape_timeout: 4s

scrape_configs:
  # ----------------------------------------------------------------------------
  # 1. API GATEWAY (Spring Cloud Gateway)
  # ----------------------------------------------------------------------------
  - job_name: 'api-gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          application: 'api-gateway'
          environment: 'local'

  # ----------------------------------------------------------------------------
  # 2. AUTH SERVICE (Spring Boot)
  # ----------------------------------------------------------------------------
  - job_name: 'auth-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8081']
        labels:
          application: 'auth-service'
          environment: 'local'

  # ----------------------------------------------------------------------------
  # 3. FACULTY SERVICE (Spring Boot)
  # ----------------------------------------------------------------------------
  - job_name: 'faculty-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8082']
        labels:
          application: 'faculty-service'
          environment: 'local'

  # ----------------------------------------------------------------------------
  # 4. SUBMISSION SERVICE (Spring Boot + MongoDB)
  # ----------------------------------------------------------------------------
  - job_name: 'submission-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8083']
        labels:
          application: 'submission-service'
          environment: 'local'

  # ----------------------------------------------------------------------------
  # 5. NOTIFICATION SERVICE (Spring Boot)
  # ----------------------------------------------------------------------------
  - job_name: 'notification-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8084']
        labels:
          application: 'notification-service'
          environment: 'local'

  # ----------------------------------------------------------------------------
  # 6. REPORT SERVICE (Spring Boot)
  # ----------------------------------------------------------------------------
  - job_name: 'report-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8085']
        labels:
          application: 'report-service'
          environment: 'local'

  # ----------------------------------------------------------------------------
  # 7. AI ANALYSIS SERVICE (Python FastAPI ML Engine)
  # ----------------------------------------------------------------------------
  - job_name: 'ai-analysis-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:8090']
        labels:
          application: 'ai-analysis-service'
          environment: 'local'

  # ----------------------------------------------------------------------------
  # 8. PROMETHEUS SELF-METRICS
  # ----------------------------------------------------------------------------
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          application: 'prometheus'
