spring.application.name=submission-service
server.port=8083

# ==========================================
# CONFIG SERVER (optional)
# ==========================================

spring.config.import=optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}

# ==========================================
# FILE UPLOAD & AWS S3 CLOUD STORAGE
# ==========================================

file.upload.dir=${FILE_UPLOAD_DIR:${java.io.tmpdir}/integrityai_uploads}
file.upload.max-size-bytes=${FILE_UPLOAD_MAX_BYTES:20971520}

aws.s3.enabled=${AWS_S3_ENABLED:true}
aws.s3.bucket=${AWS_S3_BUCKET:integrityai-submissions-aarmee}
aws.s3.region=${AWS_REGION:eu-north-1}
aws.accessKeyId=${AWS_ACCESS_KEY_ID:}
aws.secretKey=${AWS_SECRET_ACCESS_KEY:}

# Spring Boot multipart config
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# ==========================================
# MONGODB
# ==========================================

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/integrityai_submission}

spring.data.mongodb.database=${MONGODB_DATABASE:integrityai_submission}

# ==========================================
# FACULTY SERVICE
# ==========================================

faculty.service.url=${FACULTY_SERVICE_URL:http://localhost:8082}

# ==========================================
# AI ANALYSIS SERVICE
# ==========================================

ai.analysis.service.url=${AI_ANALYSIS_SERVICE_URL:http://localhost:8090}
spring.cloud.openfeign.client.config.default.connect-timeout=15000
spring.cloud.openfeign.client.config.default.read-timeout=120000
feign.client.config.default.connect-timeout=15000
feign.client.config.default.read-timeout=120000

# ==========================================
# NOTIFICATION SERVICE
# ==========================================

notification.service.url=${NOTIFICATION_SERVICE_URL:http://localhost:8084}

# ==========================================
# JWT (shared secret — same as auth-service)
# ==========================================

jwt.secret=${JWT_SECRET:integrityai-secret-key-for-jwt-authentication-2026-must-be-at-least-256-bits}

# ==========================================
# SWAGGER
# ==========================================

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ==========================================
# EUREKA CLIENT
# ==========================================

eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30

# ==========================================
# ACTUATOR
# ==========================================

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.endpoint.health.show-details=always
management.info.env.enabled=true

info.app.name=IntegrityAI Submission Service
info.app.description=Student submission management service
info.app.version=1.0.0
