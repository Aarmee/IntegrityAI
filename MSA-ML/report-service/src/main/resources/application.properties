spring.application.name=report-service

server.port=8085

# ==========================================
# CONFIG SERVER (optional)
# ==========================================

spring.config.import=optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}

# ==========================================
# POSTGRESQL (Synopsis Section 7.1 alignment)
# ==========================================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/integrityai_report}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ==========================================
# AI ANALYSIS SERVICE
# ==========================================

ai.analysis.service.url=${AI_ANALYSIS_SERVICE_URL:http://localhost:8090}
spring.cloud.openfeign.client.config.default.connect-timeout=15000
spring.cloud.openfeign.client.config.default.read-timeout=120000
feign.client.config.default.connect-timeout=15000
feign.client.config.default.read-timeout=120000

# ==========================================
# NOTIFICATION SERVICE
# ==========================================

notification.service.url=${NOTIFICATION_SERVICE_URL:http://localhost:8084}

# ==========================================
# JWT (shared secret — same as auth-service)
# ==========================================

jwt.secret=${JWT_SECRET:integrityai-secret-key-for-jwt-authentication-2026-must-be-at-least-256-bits}

# ==========================================
# SWAGGER
# ==========================================

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ==========================================
# EUREKA CLIENT
# ==========================================

eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30

# ==========================================
# ACTUATOR
# ==========================================

management.endpoints.web.exposure.include=health,info
management.info.env.enabled=true

info.app.name=IntegrityAI Report Service
info.app.description=Academic integrity report generation and retrieval service
info.app.version=1.0.0
