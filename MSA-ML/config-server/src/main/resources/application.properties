spring.application.name=config-server

server.port=8888

# ==========================================
# CONFIG SERVER — NATIVE (filesystem) BACKEND
# Reads config files from the bundled classpath
# No external Git repo required
# ==========================================

spring.profiles.active=native

spring.cloud.config.server.native.search-locations=classpath:/config

# ==========================================
# ACTUATOR
# ==========================================

management.endpoints.web.exposure.include=health,info
management.info.env.enabled=true

info.app.name=IntegrityAI Config Server
info.app.description=Centralised configuration server
info.app.version=1.0.0
