# =====================================================
# Faculty Service — centralised non-sensitive config
# =====================================================

server.port=8082

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

auth.service.url=${AUTH_SERVICE_URL:http://localhost:8081}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

info.app.name=IntegrityAI Faculty Service
info.app.description=Faculty profile and assignment management service
info.app.version=1.0.0
