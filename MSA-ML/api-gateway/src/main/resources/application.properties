spring.application.name=api-gateway

server.port=8080

server.error.include-message=always
server.error.include-stacktrace=always
server.error.include-exception=true
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.web=DEBUG


# ==========================================
# CONFIG SERVER (optional)
# ==========================================

spring.config.import=optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}

# ==========================================
# EUREKA CLIENT
# ==========================================

eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# ==========================================
# GATEWAY ROUTES
# Uses lb:// (load-balanced) URIs via Eureka
# Fallback to direct URLs when Eureka is not available
# ==========================================

# --- Auth Service ---
spring.cloud.gateway.server.webmvc.routes[0].id=auth-service-auth
spring.cloud.gateway.server.webmvc.routes[0].uri=${AUTH_SERVICE_URI:http://localhost:8081}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.server.webmvc.routes[1].id=auth-service-users
spring.cloud.gateway.server.webmvc.routes[1].uri=${AUTH_SERVICE_URI:http://localhost:8081}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/users/**

# --- Faculty Service ---
spring.cloud.gateway.server.webmvc.routes[2].id=faculty-service-faculty
spring.cloud.gateway.server.webmvc.routes[2].uri=${FACULTY_SERVICE_URI:http://localhost:8082}
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/faculty/**

spring.cloud.gateway.server.webmvc.routes[3].id=faculty-service-assignments
spring.cloud.gateway.server.webmvc.routes[3].uri=${FACULTY_SERVICE_URI:http://localhost:8082}
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/assignments/**

# --- Submission Service ---
spring.cloud.gateway.server.webmvc.routes[4].id=submission-service
spring.cloud.gateway.server.webmvc.routes[4].uri=${SUBMISSION_SERVICE_URI:http://localhost:8083}
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/submissions/**

# --- Notification Service ---
spring.cloud.gateway.server.webmvc.routes[5].id=notification-service
spring.cloud.gateway.server.webmvc.routes[5].uri=${NOTIFICATION_SERVICE_URI:http://localhost:8084}
spring.cloud.gateway.server.webmvc.routes[5].predicates[0]=Path=/api/notifications/**

# --- Report Service ---
spring.cloud.gateway.server.webmvc.routes[6].id=report-service
spring.cloud.gateway.server.webmvc.routes[6].uri=${REPORT_SERVICE_URI:http://localhost:8085}
spring.cloud.gateway.server.webmvc.routes[6].predicates[0]=Path=/api/reports/**

# --- AI Analysis Service ---
spring.cloud.gateway.server.webmvc.routes[7].id=ai-analysis-service
spring.cloud.gateway.server.webmvc.routes[7].uri=${AI_ANALYSIS_SERVICE_URI:http://localhost:8090}
spring.cloud.gateway.server.webmvc.routes[7].predicates[0]=Path=/api/analysis/**

# ==========================================
# ACTUATOR
# ==========================================

management.endpoints.web.exposure.include=health,info
management.info.env.enabled=true

info.app.name=IntegrityAI API Gateway
info.app.description=Single entry point for all IntegrityAI microservices
info.app.version=1.0.0

# ==========================================
# JWT (shared secret — same as auth-service)
# ==========================================

jwt.secret=${JWT_SECRET:integrityai-secret-key-for-jwt-authentication-2026-must-be-at-least-256-bits}
