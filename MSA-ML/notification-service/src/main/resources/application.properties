spring.application.name=notification-service

server.port=8084

# ==========================================
# CONFIG SERVER (optional)
# ==========================================

spring.config.import=optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}

# ==========================================
# JWT (shared secret — same as auth-service)
# ==========================================

jwt.secret=${JWT_SECRET:integrityai-secret-key-for-jwt-authentication-2026-must-be-at-least-256-bits}

# ==========================================
# POSTGRESQL (Synopsis Section 7.1 alignment)
# ==========================================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/integrityai_notification}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ==========================================
# EMAIL DELIVERY CONFIGURATION (Cloud-Safe HTTPS & SMTP)
# ==========================================
mail.resend.api-key=${RESEND_API_KEY:}
mail.resend.from=${RESEND_FROM:IntegrityAI Academic Portal <onboarding@resend.dev>}
mail.resend.test-email=${RESEND_TEST_EMAIL:aaru140604@gmail.com}
mail.brevo.api-key=${BREVO_API_KEY:}

# Standard SMTP (Port 587 STARTTLS)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}

auth.service.url=${AUTH_SERVICE_URL:http://localhost:8081}

# ==========================================
# SWAGGER
# ==========================================

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ==========================================
# EUREKA CLIENT
# ==========================================

eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30

# ==========================================
# ACTUATOR
# ==========================================

management.endpoints.web.exposure.include=health,info
management.info.env.enabled=true

info.app.name=IntegrityAI Notification Service
info.app.description=User notification management service
info.app.version=1.0.0
