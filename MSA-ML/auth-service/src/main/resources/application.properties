spring.application.name=auth-service

# ==========================================
# SERVER
# ==========================================

server.port=${PORT:${SERVER_PORT:8081}}

# ==========================================
# CONFIG SERVER (optional — falls back to local config if unavailable)
# ==========================================

spring.config.import=optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}


# ==========================================
# POSTGRESQL
# ==========================================

spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:integrityai_auth}?sslmode=${DB_SSLMODE:prefer}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}


# ==========================================
# JPA / HIBERNATE
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true


# ==========================================
# JWT
# ==========================================

jwt.secret=${JWT_SECRET:integrityai-secret-key-for-jwt-authentication-2026-must-be-at-least-256-bits}

jwt.expiration.ms=86400000


# ==========================================
# ACTUATOR
# ==========================================

management.endpoints.web.exposure.include=health,info

management.info.env.enabled=true

info.app.name=IntegrityAI Auth Service
info.app.description=Authentication and user management service
info.app.version=1.0.0


# ==========================================
# SWAGGER
# ==========================================

springdoc.api-docs.path=/v3/api-docs

springdoc.swagger-ui.path=/swagger-ui.html

# ==========================================
# EUREKA CLIENT
# ==========================================

eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=${EUREKA_REGISTER:false}
eureka.client.fetch-registry=${EUREKA_FETCH:false}
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30
